name: Unsigned macOS Package
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions: { contents: write }
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build unsigned app
        run: |
          xcodebuild -skipPackagePluginValidation -project DynamicIsland.xcodeproj -scheme DynamicIsland -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP=$(find build/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/Atoll-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Atoll-unsigned
          path: build/Atoll-unsigned.zip
