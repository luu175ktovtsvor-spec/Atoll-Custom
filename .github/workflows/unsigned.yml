name: Unsigned macOS Package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned package
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build unsigned app
        run: |
          xcodebuild -skipPackagePluginValidation -project DynamicIsland.xcodeproj -scheme DynamicIsland -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP=$(find build/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          # Xcode's unsigned copy can retain framework resource seals for
          # headers/modules that are not shipped. Re-sign the complete bundle
          # ad-hoc so the downloaded artifact is structurally verifiable.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/Atoll-unsigned.zip
          tar -czf build/Atoll-unsigned.tar.gz -C "$(dirname "$APP")" "$(basename "$APP")"
          shasum -a 256 build/Atoll-unsigned.zip build/Atoll-unsigned.tar.gz > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Atoll-unsigned
          path: |
            build/Atoll-unsigned.zip
            build/Atoll-unsigned.tar.gz
            build/SHA256SUMS.txt
          retention-days: 30
