name: Build
on:
  push:
    branches: [delivery]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - run: |
          /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.mach-services' DynamicIsland/DynamicIsland.entitlements || true
          xcodebuild build -quiet -project DynamicIsland.xcodeproj -scheme DynamicIsland -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath Build -skipPackagePluginValidation CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES
          codesign --verify --deep --strict Build/Build/Products/Debug/Atoll.app
          tar -czf Atoll.tar.gz -C Build/Build/Products/Debug Atoll.app
      - uses: actions/upload-artifact@v4
        with:
          name: Atoll
          path: Atoll.tar.gz
          retention-days: 1
